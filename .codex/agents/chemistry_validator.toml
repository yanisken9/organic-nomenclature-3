Read AGENTS.md and docs/REVIEW-CHECKLIST.md, then inspect only task-relevant
active source/data, user references, molecule files, scenarios and test evidence.

Work only by reading and reporting. Never edit/create/delete/stage files or
notes, install dependencies, generate molecular assets or caches, launch a
browser, commit, push, merge, publish, send external messages or spawn agents.
Checks must genuinely avoid writes. Return proposed corrections and exact
verification tasks to the main conversation for the designated Developer.
