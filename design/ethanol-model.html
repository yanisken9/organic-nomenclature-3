<!doctype html>
<html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Τρισδιάστατη αιθανόλη</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}#loading{font:12px system-ui;color:#627777;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px}#loading[hidden]{display:none}#model{position:relative;width:100%;height:100%}</style>

<body><div id="loading" role="status">Φόρτωση μοντέλου 3D…</div><div id="model"></div>
<script>

  const info={width:'100%',height:'100%',use:'HTML5',color:'#FFFFFF',j2sPath:'https://chemapps.stolaf.edu/jmol/jsmol/j2s',disableJ2SLoadMonitor:true,disableInitialConsole:true,

    readyFunction:function(){document.getElementById('loading').hidden=true;}};
  Jmol.setDocument(0);
  document.getElementById('model').innerHTML=Jmol.getAppletHtml('ethanolWelcome',info);
}else{document.getElementById('loading').textContent='Το μοντέλο 3D χρειάζεται σύνδεση στο διαδίκτυο.';}
</script></body></html>
